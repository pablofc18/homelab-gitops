name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Run yamllint
        run: yamllint --strict --format github .

  kubeconform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: ./scripts/ci-install-tools.sh helm yq kubeconform

      - name: Render and validate manifests
        run: ./scripts/validate-manifests.sh

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: ./scripts/ci-install-tools.sh helm yq kubeconform trivy

      - name: Render manifests
        run: RENDER_DIR=.rendered ./scripts/validate-manifests.sh

      - name: Scan rendered manifests for misconfigurations
        run: >-
          trivy config --skip-version-check --exit-code 1 --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml .rendered/manifests
