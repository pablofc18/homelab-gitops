name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Run yamllint
        run: yamllint --strict --format github .

  kubeconform:
    runs-on: ubuntu-24.04
    env:
      HELM_VERSION: v4.2.2
      YQ_VERSION: v4.54.1
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" --strip-components=1 linux-amd64/helm
          curl -sSL -o "$HOME/bin/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x "$HOME/bin/yq"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Render and validate manifests
        run: ./scripts/validate-manifests.sh
