# Accepted Trivy misconfiguration findings. Every entry must be scoped to the
# rendered manifest it applies to and explain why the risk is accepted.
# Paths are relative to the scanned directory (rendered manifests, one file per app).
misconfigurations:
  - id: KSV-0024
    paths:
      - traefik.yaml
    statement: >-
      Traefik binds hostPort 80/443 on purpose: kind has no cloud load balancer and only the
      control-plane node maps these ports to the host. See docs/architecture.md (Network path).
  - id: KSV-0041
    paths:
      - traefik.yaml
    statement: >-
      The ingress controller must read TLS Secrets in every namespace that defines an Ingress.
      Revisit if Traefik is restricted to a fixed set of namespaces.
  - id: KSV-0041
    paths:
      - cert-manager.yaml
    statement: >-
      cert-manager stores every issued certificate and its private key in a Secret, in the
      namespace of the Certificate, so its controllers must manage Secrets cluster-wide.
      The chart's RBAC is all-or-nothing (global.rbac.create), it cannot be scoped down.
  - id: KSV-0056
    paths:
      - cert-manager.yaml
    statement: >-
      The ACME challenges controller creates temporary solver Pods, Services and Ingresses for
      HTTP-01 validation. Not used yet (local CA issuer), but the ClusterRole is not optional.
  - id: KSV-0114
    paths:
      - cert-manager.yaml
    statement: >-
      cainjector patches the caBundle of cert-manager's own webhook configurations. Disabling it
      would break the cert-manager webhook, so the permission is required.
  - id: KSV-0009
    paths:
      - kube-prometheus-stack.yaml
    statement: >-
      node-exporter measures the node, not its own container: it needs the host network
      namespace to report the node's network interfaces and traffic.
  - id: KSV-0010
    paths:
      - kube-prometheus-stack.yaml
    statement: >-
      node-exporter needs the host PID namespace to report node-level process metrics.
  - id: KSV-0121
    paths:
      - kube-prometheus-stack.yaml
    statement: >-
      node-exporter mounts the host's /, /proc and /sys read-only to read filesystem, CPU,
      memory and hardware metrics of the node.
  - id: KSV-0041
    paths:
      - kube-prometheus-stack.yaml
    statement: >-
      prometheus-operator generates the Prometheus and Alertmanager configuration as Secrets.
      kube-state-metrics no longer reads Secrets (its "secrets" collector is disabled), so this
      only covers the operator. The ignore is file-wide: re-check if another component adds it.
  - id: KSV-0056
    paths:
      - kube-prometheus-stack.yaml
    statement: >-
      prometheus-operator creates the governing Services (prometheus-operated,
      alertmanager-operated) and maintains the kubelet Service and Endpoints it scrapes.
