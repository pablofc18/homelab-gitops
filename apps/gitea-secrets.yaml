apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-secrets
  namespace: argocd
spec:
  project: default
  # Own resources for the gitea chart app (the admin SopsSecret), like monitoring next to
  # kube-prometheus-stack. Until its Secret exists the Gitea pod waits in its init containers.
  source:
    repoURL: https://github.com/pablofc18/homelab-gitops.git
    path: manifests/gitea-secrets
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Uses the SopsSecret CRD from sops-secrets-operator, see cert-manager-issuers.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
