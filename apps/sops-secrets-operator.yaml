apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://isindir.github.io/sops-secrets-operator
    chart: sops-secrets-operator
    targetRevision: "0.28.1"
    helm:
      values: |
        # The age private key is loaded by `make up` / `make sops-key` into the Secret
        # sops-age-key (the "secret zero"): it is the only secret that never goes to Git.
        secretsAsFiles:
          - name: sops-age-key
            mountPath: /etc/sops-age
            secretName: sops-age-key
        extraEnv:
          - name: SOPS_AGE_KEY_FILE
            value: /etc/sops-age/keys.txt
        # The chart ships these hardening settings disabled by default.
        securityContext:
          enabled: true
          container:
            enabled: true
            customContainerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: sops-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
