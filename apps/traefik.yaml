apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "42.0.0"
    helm:
      values: |
        service:
          spec:
            type: ClusterIP
        ports:
          web:
            hostPort: 80
          websecure:
            hostPort: 443
        nodeSelector:
          ingress-ready: "true"
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        # Traefik copies its Service's load balancer address into every Ingress status, but a
        # ClusterIP Service has none, so ArgoCD keeps Ingresses "Progressing". Publish the address
        # traffic really enters through instead (kind: hostPort on localhost).
        providers:
          kubernetesIngress:
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 127.0.0.1
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
