apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "42.1.3"
    helm:
      values: |
        service:
          spec:
            type: ClusterIP
        # Traefik sees every request to every app, so its per-service request counts, status
        # codes and latency histograms are the SLIs for Vaultwarden, Gitea, Grafana... The
        # metrics entrypoint (:9100) stays internal: a dedicated ClusterIP Service for it, and a
        # ServiceMonitor that tells the Prometheus Operator to scrape it.
        metrics:
          prometheus:
            service:
              enabled: true
            # Render the ServiceMonitor even when helm template cannot see the CRD (CI, first
            # sync of a fresh cluster); SkipDryRunOnMissingResource covers the CRD ordering.
            disableAPICheck: true
            serviceMonitor:
              enabled: true
              # kube-prometheus-stack's Prometheus only selects ServiceMonitors carrying this
              # label (serviceMonitorSelectorNilUsesHelmValues). Without it, nothing is scraped.
              additionalLabels:
                release: kube-prometheus-stack
              # Traefik's own "service" label names the backend (e.g. vaultwarden-...@kubernetes),
              # but Prometheus also attaches the scraped Service (traefik-metrics) as "service" and,
              # by default, renames Traefik's to exported_service. Keep Traefik's labels instead;
              # it emits no job/instance labels that could override the scrape ones.
              honorLabels: true
        ports:
          web:
            hostPort: 80
            # Every request on :80 gets a permanent redirect (308) to the same URL on
            # websecure, before any router matches. Port 80 only exists to redirect.
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            hostPort: 443
        nodeSelector:
          ingress-ready: "true"
        # Only one node can bind hostPort 80/443, so the new pod cannot start while the old one
        # holds the ports. Stop the old pod first (a few seconds of downtime per upgrade).
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        # Traefik copies its Service's load balancer address into every Ingress status, but a
        # ClusterIP Service has none, so ArgoCD keeps Ingresses "Progressing". Publish the address
        # traffic really enters through instead (kind: hostPort on localhost).
        providers:
          kubernetesIngress:
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 127.0.0.1
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ServiceMonitor uses the Prometheus Operator CRD from kube-prometheus-stack.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
