apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "42.1.2"
    helm:
      values: |
        service:
          spec:
            type: ClusterIP
        ports:
          web:
            hostPort: 80
            # Every request on :80 gets a permanent redirect (308) to the same URL on
            # websecure, before any router matches. Port 80 only exists to redirect.
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            hostPort: 443
        nodeSelector:
          ingress-ready: "true"
        # Only one node can bind hostPort 80/443, so the new pod cannot start while the old one
        # holds the ports. Stop the old pod first (a few seconds of downtime per upgrade).
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        # Traefik copies its Service's load balancer address into every Ingress status, but a
        # ClusterIP Service has none, so ArgoCD keeps Ingresses "Progressing". Publish the address
        # traffic really enters through instead (kind: hostPort on localhost).
        providers:
          kubernetesIngress:
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 127.0.0.1
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
