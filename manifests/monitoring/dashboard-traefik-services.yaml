# Grafana's dashboard sidecar loads every ConfigMap in this namespace labelled
# grafana_dashboard=1 (sidecar.dashboards.searchNamespace in apps/kube-prometheus-stack.yaml).
# Dashboards loaded this way are read-only in the UI: edit the JSON here (or export it from
# Grafana after changing a copy) and merge.
#
# Golden signals per backend service, from Traefik's metrics (every request to every app goes
# through it, so no app needs its own exporter). "service" is the Traefik backend name, e.g.
# vaultwarden-vaultwarden-http@kubernetes (kept by honorLabels on the ServiceMonitor).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-traefik-services
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  traefik-services.json: |
    {
      "uid": "traefik-services",
      "title": "Services (Traefik)",
      "description": "Request rate, 5xx error ratio and latency per backend service, measured at the Traefik ingress.",
      "tags": ["traefik", "slo"],
      "editable": false,
      "schemaVersion": 39,
      "time": {"from": "now-1h", "to": "now"},
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(traefik_service_requests_total, service)", "refId": "service"},
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {"text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate",
          "description": "Requests per second reaching each service.",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(traefik_service_requests_total{service=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error ratio (5xx)",
          "description": "Share of responses with a 5xx status. The 'or ... * 0' part returns 0 instead of no data while a service has no errors. 4xx are client errors and do not count against the service.",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "decimals": 2}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "refId": "A",
              "expr": "(sum by (service) (rate(traefik_service_requests_total{service=~\"$service\", code=~\"5..\"}[$__rate_interval])) or sum by (service) (rate(traefik_service_requests_total{service=~\"$service\"}[$__rate_interval])) * 0) / sum by (service) (rate(traefik_service_requests_total{service=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p95",
          "description": "95th percentile of request duration. Traefik's default histogram buckets are 0.1, 0.3, 1.2 and 5 s, and histogram_quantile interpolates inside a bucket: a value like 0.095 s means 'under 100 ms', not exactly 95 ms.",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Responses by status code",
          "description": "Responses per second for the selected services, split by HTTP status code.",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0, "custom": {"stacking": {"mode": "normal"}, "fillOpacity": 30}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (code) (rate(traefik_service_requests_total{service=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            }
          ]
        }
      ]
    }
