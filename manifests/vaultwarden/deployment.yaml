# Self-hosted Bitwarden-compatible password manager, backed by SQLite on a PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: never run two pods at once, so stop the old pod
  # before starting the new one instead of a rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
          env:
            # The image listens on 80 by default; non-root users cannot bind ports below 1024.
            - name: ROCKET_PORT
              value: "8080"
            # Public URL, used to build links in emails, attachments and WebAuthn/U2F.
            - name: DOMAIN
              value: "https://vaultwarden.localhost"
            # Open for now to create the first account; to be closed in a later step.
            - name: SIGNUPS_ALLOWED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /alive
              port: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
        - name: tmp
          emptyDir: {}
