# Self-hosted Bitwarden-compatible password manager, backed by SQLite on a PVC.
# A StatefulSet, not a Deployment: it guarantees at most one pod per identity, so a
# replacement pod is only created once the old one is gone. A Deployment's ReplicaSet
# starts the replacement right away, and ReadWriteOnce does not prevent it (it limits
# mounts to one node, not one pod).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  # Required field. Pods get stable DNS names only with a headless Service; nothing
  # resolves this pod by name, so the regular Service is enough.
  serviceName: vaultwarden
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
          env:
            # The image listens on 80 by default; non-root users cannot bind ports below 1024.
            - name: ROCKET_PORT
              value: "8080"
            # Public URL, used to build links in emails, attachments and WebAuthn/U2F.
            - name: DOMAIN
              value: "https://vaultwarden.localhost"
            # No public registration: new users are invited from the admin panel.
            - name: SIGNUPS_ALLOWED
              value: "false"
            # Enables /admin. Treat the panel as read-only for settings: saving there writes
            # /data/config.json, which overrides these env vars and is invisible to Git.
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-admin
                  key: admin-token
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /alive
              port: http
      volumes:
        # The existing PVC, kept declared in Git, instead of volumeClaimTemplates: a
        # template would create a new, empty data-vaultwarden-0 claim managed by the
        # StatefulSet controller, and a single SQLite replica never needs one per pod.
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
        - name: tmp
          emptyDir: {}
