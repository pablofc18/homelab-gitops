# Unit tests for manifests/monitoring/slo-latency.yaml. Run with `make test-rules`.
rule_files:
  - ../../.rendered/prometheus-rules/slo-latency.yaml

evaluation_interval: 1m

# Without an order promtool evaluates the groups in random order, so an alert would sometimes read
# the previous minute's ratio and the percentages in its annotations would change between runs.
group_eval_order:
  - slo-latency.rules
  - slo-latency.alerts

tests:
  - interval: 1m
    input_series:
      # slow: 20% of HTTP requests over 300 ms, all the time.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="slow"}'
        values: '0+100x150'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="slow", le="0.3"}'
        values: '0+80x150'
      # recovers: 20% slow for 90 minutes, then every request is fast.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="recovers"}'
        values: '0+100x150'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="recovers", le="0.3"}'
        values: '0+80x90 7300+100x59'
      # leak: 4% slow, above the slow-burn thresholds (3 and 1 x 1%) but below the fast ones (14.4 and 6 x 1%).
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="leak"}'
        values: '0+100x150'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="leak", le="0.3"}'
        values: '0+96x150'
      # healthy: HTTP is fast; its websockets last the whole connection and must be ignored.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="healthy"}'
        values: '0+100x150'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="healthy", le="0.3"}'
        values: '0+100x150'
      - series: 'traefik_service_request_duration_seconds_count{protocol="websocket", service="healthy"}'
        values: '0+10x150'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="websocket", service="healthy", le="0.3"}'
        values: '0+0x150'
      # idle: the series exist but there is no traffic, so the ratio is NaN.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="idle"}'
        values: '5+0x150'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="idle", le="0.3"}'
        values: '5+0x150'

    promql_expr_test:
      # Rounded because promtool compares exactly and 1 - 80/100 is 0.20000000000000007.
      - expr: round(service:traefik_service_slow_requests:ratio_rate5m{service=~"slow|healthy"}, 0.001)
        eval_time: 90m
        exp_samples:
          - labels: '{service="healthy"}'
            value: 0
          - labels: '{service="slow"}'
            value: 0.2

    alert_rule_test:
      # The "for" clause holds the alert back: nothing fires right away.
      - eval_time: 1m
        alertname: ServiceLatencyBudgetFastBurn
        exp_alerts: []
      # Fast burn is past its 2 minutes at 10m, slow burn is still within its 15.
      - eval_time: 10m
        alertname: ServiceLatencyBudgetFastBurn
        exp_alerts:
          - exp_labels: {severity: critical, service: recovers}
            exp_annotations:
              summary: "recovers is burning its latency budget fast"
              description: "20% of HTTP requests to recovers take over 300 ms. At this rate the 30-day latency budget (1%) runs out within days."
          - exp_labels: {severity: critical, service: slow}
            exp_annotations:
              summary: "slow is burning its latency budget fast"
              description: "20% of HTTP requests to slow take over 300 ms. At this rate the 30-day latency budget (1%) runs out within days."
      - eval_time: 10m
        alertname: ServiceLatencyBudgetSlowBurn
        exp_alerts: []
      # 4% slow is a slow burn only. healthy and idle never fire.
      - eval_time: 90m
        alertname: ServiceLatencyBudgetSlowBurn
        exp_alerts:
          - exp_labels: {severity: warning, service: leak}
            exp_annotations:
              summary: "leak is steadily burning its latency budget"
              description: "4% of HTTP requests to leak take over 300 ms, enough to exhaust the 30-day latency budget (1%) before the month ends."
          - exp_labels: {severity: warning, service: recovers}
            exp_annotations:
              summary: "recovers is steadily burning its latency budget"
              description: "20% of HTTP requests to recovers take over 300 ms, enough to exhaust the 30-day latency budget (1%) before the month ends."
          - exp_labels: {severity: warning, service: slow}
            exp_annotations:
              summary: "slow is steadily burning its latency budget"
              description: "20% of HTTP requests to slow take over 300 ms, enough to exhaust the 30-day latency budget (1%) before the month ends."
      # 40 minutes after recovering, the 30m window clears branch B although the 6h one still sees
      # the problem. Without the short window it would keep firing.
      - eval_time: 130m
        alertname: ServiceLatencyBudgetFastBurn
        exp_alerts:
          - exp_labels: {severity: critical, service: slow}
            exp_annotations:
              summary: "slow is burning its latency budget fast"
              description: "20% of HTTP requests to slow take over 300 ms. At this rate the 30-day latency budget (1%) runs out within days."

  # The slow burn also clears on its short windows: at 450m the 2h and 6h ones are clean, while the
  # 1d and 3d ones still hold the 90 bad minutes. On its own because a series that ended recently
  # stays inside the 6h window and would keep firing.
  - interval: 1m
    input_series:
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="recovers"}'
        values: '0+100x450'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="recovers", le="0.3"}'
        values: '0+80x90 7300+100x359'
    alert_rule_test:
      - eval_time: 450m
        alertname: ServiceLatencyBudgetSlowBurn
        exp_alerts: []

  # Each alert is "branch A or branch B", and a constantly slow service fires both, which would hide
  # a broken branch. These scenarios fire exactly one, or none.
  - interval: 1m
    input_series:
      # steady10: 10% slow is under fast-burn branch A (14.4%), over branch B (6%).
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="steady10"}'
        values: '0+100x60'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="steady10", le="0.3"}'
        values: '0+90x60'
      # blip: every request slow for 2 minutes. The short windows see it, the long ones do not care.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="blip"}'
        values: '0+100x62'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="blip", le="0.3"}'
        values: '0+100x50 5000+0x1 5100+100x9'
      # burst: 6 clean hours, every request slow for 15 minutes, then clean again. Branch A only, as
      # the 6h window stays under 6%: not yet at 8 minutes (1h window at 14%), firing at 15 (25%), and
      # cleared by the 5m window 10 minutes later although the 1h window is still at 25%.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="burst"}'
        values: '0+100x390'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="burst", le="0.3"}'
        values: '0+100x360 36000+0x14 36100+100x14'
    alert_rule_test:
      - eval_time: 55m
        alertname: ServiceLatencyBudgetFastBurn
        exp_alerts:
          - exp_labels: {severity: critical, service: steady10}
            exp_annotations:
              summary: "steady10 is burning its latency budget fast"
              description: "10% of HTTP requests to steady10 take over 300 ms. At this rate the 30-day latency budget (1%) runs out within days."
      - eval_time: 368m
        alertname: ServiceLatencyBudgetFastBurn
        exp_alerts: []
      - eval_time: 385m
        alertname: ServiceLatencyBudgetFastBurn
        exp_alerts: []
      - eval_time: 375m
        alertname: ServiceLatencyBudgetFastBurn
        exp_alerts:
          - exp_labels: {severity: critical, service: burst}
            exp_annotations:
              summary: "burst is burning its latency budget fast"
              description: "25.42% of HTTP requests to burst take over 300 ms. At this rate the 30-day latency budget (1%) runs out within days."

  # Three days of data at one sample every 5 minutes, enough for the 3d window.
  - interval: 5m
    input_series:
      # lastday: heavy clean traffic for 2 days, then light traffic with 4% slow. Slow-burn branch A
      # only: 4% over 1d and 2h, but the 3d window is under 1%.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="lastday"}'
        values: '0+5000x576 2880500+500x287'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="lastday", le="0.3"}'
        values: '0+5000x576 2880480+480x287'
      # lastday2: same with 2% slow, under both branches: the 1d window is below 3%, the 3d one below 1%.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="lastday2"}'
        values: '0+5000x576 2880500+500x287'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="lastday2", le="0.3"}'
        values: '0+5000x576 2880490+490x287'
      # steady2: 2% slow is under branch A (3%), over branch B (1%).
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="steady2"}'
        values: '0+100x864'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="steady2", le="0.3"}'
        values: '0+98x864'
      # recent: 8% slow for the last 90 minutes. The short windows (2h, 6h) are over their thresholds,
      # the long ones (1d, 3d) are not, so it must not fire yet.
      - series: 'traefik_service_request_duration_seconds_count{protocol="http", service="recent"}'
        values: '0+5000x864'
      - series: 'traefik_service_request_duration_seconds_bucket{protocol="http", service="recent", le="0.3"}'
        values: '0+5000x846 4234600+4600x17'
    alert_rule_test:
      - eval_time: 72h
        alertname: ServiceLatencyBudgetSlowBurn
        exp_alerts:
          - exp_labels: {severity: warning, service: lastday}
            exp_annotations:
              summary: "lastday is steadily burning its latency budget"
              description: "4% of HTTP requests to lastday take over 300 ms, enough to exhaust the 30-day latency budget (1%) before the month ends."
          - exp_labels: {severity: warning, service: steady2}
            exp_annotations:
              summary: "steady2 is steadily burning its latency budget"
              description: "2% of HTTP requests to steady2 take over 300 ms, enough to exhaust the 30-day latency budget (1%) before the month ends."
